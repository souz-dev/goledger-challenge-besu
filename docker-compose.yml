services:
  postgres:
    image: postgres:16-alpine
    container_name: challenge_besu_db
    environment:
      POSTGRES_DB: challenge_besu
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d challenge_besu"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
